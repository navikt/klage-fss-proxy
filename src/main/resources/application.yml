spring:
  application:
    name: klage-fss-proxy
  main:
    banner-mode: OFF
  web:
    error:
      include-message: never
      include-stacktrace: never

server:
  port: 7081
  error:
    whitelabel:
      enabled: false

management:
  endpoint:
    health:
      show-details: never
  endpoints.web:
    exposure:
      include: info, health, metrics, prometheus
    base-path: "/internal"
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    enabled: false

SERVICE_USER_USERNAME: srvklage-dittnav
